name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: alert-enrichment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deploy/helm/alert-enrichment
      - name: Render manifests (production values)
        run: |
          helm template alert-enrichment deploy/helm/alert-enrichment \
            --kube-version 1.33.0 \
            --set slack.webhookUrl=https://hooks.slack.com/services/ci/ci/ci \
            --set dedup.backend=redis \
            --set dedup.redisUrl=redis://redis:6379/0 \
            > /tmp/rendered.yaml
          grep -q "SLACK_WEBHOOK_URL" /tmp/rendered.yaml
          grep -q "REDIS_URL" /tmp/rendered.yaml

name: e2e-kind

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    name: kind + real crashloop + real logs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: alert-enrichment-demo

      - name: Deploy the deliberately crashing app
        run: |
          kubectl apply -f demo/broken-app.yaml
          kubectl -n payments rollout status deployment/ledger --timeout=90s

      - name: Wait for a real restart and CrashLoopBackOff
        run: |
          for i in $(seq 1 90); do
            restarts=$(kubectl -n payments get pods -l app=checkout \
              -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo 0)
            reason=$(kubectl -n payments get pods -l app=checkout \
              -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || true)
            echo "restarts=$restarts reason=$reason"
            if [ "${restarts:-0}" -ge 1 ] && [ "$reason" = "CrashLoopBackOff" ]; then exit 0; fi
            sleep 2
          done
          echo "pod never entered CrashLoopBackOff" >&2
          kubectl -n payments get pods
          exit 1

      - name: Run e2e test
        env:
          RUN_E2E: "1"
        run: pytest -m e2e -v

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n payments get pods -o wide
          kubectl -n payments describe pods
          kubectl -n payments logs -l app=checkout --tail=50 --previous || true

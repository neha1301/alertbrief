[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alert-enrichment"
version = "0.1.0"
description = "FastAPI webhook that enriches Alertmanager alerts with Kubernetes context and publishes one actionable Slack message."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anyio>=4.4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "kubernetes>=30.1.0",
  "prometheus-client>=0.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
  "fakeredis[lua]>=2.23",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.7",
  "types-redis",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alert_enrichment"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["e2e: requires a real kind cluster"]

[tool.coverage.run]
source = ["alert_enrichment"]
branch = true

[tool.coverage.report]
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]
allowed-confusables = ["×", "…", "—", "·", "ℹ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "alert-enrichment.serviceAccountName" . }}
  labels:
    {{- include "alert-enrichment.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true

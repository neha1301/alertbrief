{{- if and (not .Values.slack.existingSecret) (or .Values.slack.webhookUrl .Values.dedup.redisUrl) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alert-enrichment.fullname" . }}
  labels:
    {{- include "alert-enrichment.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.slack.webhookUrl }}
  SLACK_WEBHOOK_URL: {{ .Values.slack.webhookUrl | quote }}
  {{- end }}
  {{- if .Values.dedup.redisUrl }}
  REDIS_URL: {{ .Values.dedup.redisUrl | quote }}
  {{- end }}
{{- end }}
